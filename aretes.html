<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aretes | Arte y Joyas</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf7f2;
      color: #40352b;
      text-align: center;
    }
    header {
      padding: 25px 15px;
      background: #e8dccb;
    }
    h1 {
      color: #987542;
      margin-bottom: 8px;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }
    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .producto {
      background: white;
      padding: 15px;
      border-radius: 12px;
    }
    .producto img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 8px;
    }
    .precio {
      color: #987542;
      font-weight: bold;
    }
    a.boton {
      display: inline-block;
      padding: 12px 18px;
      margin: 8px;
      background: #987542;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
    a.volver {
      color: #75552c;
    }
  </style>
</head>
<body>
  <header>
    <h1>Arte y Joyas</h1>
    <p>Aretes que complementan tu estilo</p>
  </header>

  <main>
    <h2>Nuestra colección de aretes</h2>
    <p>Descubre tus favoritos y consulta por WhatsApp.</p>

    <div class="productos">
      <article class="producto">
        <img
          src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=600&q=80"
          alt="Aretes elegantes">
        <h3>Aretes elegantes</h3>
        <p class="precio">S/ 25.00</p>
        <a class="boton"
          href="https://wa.me/51938342936?text=Hola%2C%20quiero%20consultar%20por%20los%20aretes%20elegantes">
          Pedir por WhatsApp
        </a>
      </article>
    </div>

    <p>
      <a class="volver" href="index.html">← Volver a la página principal</a>
    </p>
  </main>
</body>
</html>
